[tool.poetry]
name = "marker-api"
version = "0.1.0"
description = "Scalable API for marker to convert PDF to markdown"
authors = ["adithya-s-k <adithyaskolavi@gmail.com>"]
readme = "README.md"
packages = [{include = "marker_api"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "0.115.0"
uvicorn = "0.31.1"
python-multipart = "0.0.12"
requests = "2.32.3"
marker-pdf = {version = "1.7.5", extras = ["full"]}
pillow = "^10.0.0"
torch = "^2.7.0"
pydantic = "^2.4.2"
pydantic-settings = "^2.0.3"
python-dotenv = "^1.0.0"
rich = "^13.9.2"
pynvml = "^11.5.3"
art = "^6.3"
starlette = "^0.37.2,<0.39.0"
# DOCX conversion dependencies
weasyprint = "^63.0"
cffi = "^1.15.0"
pycairo = "^1.20.0"
mammoth = "^1.9.0"
pypdf = "^4.0.0"
pdfplumber = "^0.11.0"
python-docx = "^1.1.0"

# Optional distributed server dependencies
celery = {extras = ["redis"], version = "^5.3.6", optional = true}
flower = {version = "^2.0.1", optional = true}
redis = {version = "^5.1.1", optional = true}

[tool.poetry.extras]
distributed = ["celery", "flower", "redis"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
